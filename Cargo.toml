[workspace]
members = ["crates/ar-edit-core", "crates/ar-edit", "crates/ar-edit-collab"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Schema
schemars = { version = "0.8", features = ["chrono"] }

# Core
thiserror = "2"
which = "7"
regex = "1"

# Collaboration (SPEC-003) — pure core deps (no iroh)
loro = "1"
blake3 = "1"
spake2 = "0.4"
rand = "0.8"
bip39 = "2"
# Collaboration shell deps (Phase S; behind the `transport` feature)
iroh = "1"
iroh-blobs = "0.103"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
pkarr = { version = "2", default-features = false, features = ["async", "relay"] }

# Binary
ar-edit-core = { path = "crates/ar-edit-core" }
ar-edit-collab = { path = "crates/ar-edit-collab" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
notify = "7"
indicatif = "0.17"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap_complete = "4"

# Dev / test
tempfile = "3"
assert_cmd = "2"
jsonschema = "0.28"
